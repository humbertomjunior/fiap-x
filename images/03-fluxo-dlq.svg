<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="420" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Estratégia de retry e Dead Letter Queue (SQS)</text>

  <rect x="40" y="70" width="220" height="60" rx="10" fill="#ffffff" stroke="#854F0B" stroke-width="1.2"/>
  <text x="150" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">Fila principal</text>
  <text x="150" y="113" text-anchor="middle" font-size="11" fill="#633806">ex.: video-uploaded-queue</text>

  <rect x="360" y="70" width="220" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="470" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Listener (Java)</text>
  <text x="470" y="113" text-anchor="middle" font-size="11" fill="#712B13">@SqsListener processa a mensagem</text>

  <path d="M260 100 L360 100" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="270" y="93" font-size="11" fill="#5F5E5A">entrega</text>

  <!-- decision -->
  <polygon points="470,160 560,210 470,260 380,210" fill="#FFF8E6" stroke="#854F0B" stroke-width="1.2"/>
  <text x="470" y="205" text-anchor="middle" font-size="12" fill="#412402">Processou</text>
  <text x="470" y="220" text-anchor="middle" font-size="12" fill="#412402">com sucesso?</text>

  <path d="M470 130 L470 160" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arrow3)"/>

  <!-- success -->
  <path d="M560 210 L740 210" fill="none" stroke="#3B6D11" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="600" y="200" font-size="11" fill="#27500A">sim</text>
  <rect x="740" y="180" width="220" height="60" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="850" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Mensagem removida</text>
  <text x="850" y="223" text-anchor="middle" font-size="11" fill="#27500A">ack automático (Spring Cloud AWS)</text>

  <!-- failure -->
  <path d="M470 260 L470 300" fill="none" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="480" y="285" font-size="11" fill="#791F1F">não (exceção sobe)</text>

  <rect x="330" y="300" width="280" height="60" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <text x="470" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#501313">Mensagem NÃO confirmada</text>
  <text x="470" y="343" text-anchor="middle" font-size="11" fill="#791F1F">volta a ficar visível após VisibilityTimeout</text>

  <path d="M330 330 C 200 330, 150 200, 150 130" fill="none" stroke="#A32D2D" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
  <text x="60" y="230" font-size="11" fill="#791F1F">retry (até 4x)</text>

  <!-- DLQ -->
  <rect x="800" y="330" width="240" height="60" rx="10" fill="#ffffff" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="920" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">Dead Letter Queue</text>
  <text x="920" y="373" text-anchor="middle" font-size="11" fill="#633806">após 4 tentativas sem sucesso</text>

  <path d="M610 340 C 720 340, 760 355, 798 358" fill="none" stroke="#854F0B" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="550" y="405" text-anchor="middle" font-size="11" fill="#633806">RedrivePolicy: maxReceiveCount=4 — movido automaticamente pelo SQS/LocalStack, sem intervenção do código Java</text>
</svg>
